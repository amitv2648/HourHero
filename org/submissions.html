<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HourHero — Submissions</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    body { background: var(--color-gray-100); }
    .org-main { margin-left:220px; padding:var(--space-8); min-height:100vh; }
    @media(max-width:640px){
      .org-main { margin-left:0; padding:var(--space-4);
                  padding-top:calc(var(--nav-height)+var(--space-4)); }
    }
    .sub-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-3);
    }
    .sub-card-top {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .sub-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sub-top-main { flex: 1; }
    .sub-vol-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-gray-900);
    }
    .sub-opp-title {
      font-size: 0.8rem;
      color: var(--color-gray-500);
      margin-top: 2px;
    }
    .sub-meta-row {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-3);
      font-size: 0.8rem;
      color: var(--color-gray-500);
    }
    .sub-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sub-meta-item svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sub-desc {
      font-size: 0.85rem;
      color: var(--color-gray-600);
      background: var(--color-gray-50);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-3);
      line-height: 1.5;
    }
    .sub-actions {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      align-items: center;
    }
    .reject-input {
      flex: 1;
      min-width: 180px;
    }
    .reviewed-note {
      font-size: 0.78rem;
      color: var(--color-gray-400);
      margin-left: auto;
    }
    @keyframes shimmer {
      0%   { background-position:-400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg,
        var(--color-gray-100) 25%, var(--color-gray-200) 50%,
        var(--color-gray-100) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>

  <aside class="org-sidebar">
    <div class="org-sidebar-logo">HourHero</div>
    <div class="org-sidebar-label">Main</div>
    <nav class="org-sidebar-nav">
      <a href="dashboard.html" class="org-nav-item">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>Dashboard
      </a>
      <a href="submissions.html" class="org-nav-item active">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>Submissions
        <span class="badge badge-pending" id="sb-pending-badge"
              style="margin-left:auto;display:none;">0</span>
      </a>
    </nav>
    <div class="org-sidebar-label">Opportunities</div>
    <nav class="org-sidebar-nav">
      <a href="create-opportunity.html" class="org-nav-item">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>Create opportunity
      </a>
      <a href="manage-opportunities.html" class="org-nav-item">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
        </svg>Manage opportunities
      </a>
      <a href="participants.html" class="org-nav-item">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>Participants
      </a>
    </nav>
    <div class="org-sidebar-label" style="margin-top:auto;">Account</div>
    <nav class="org-sidebar-nav">
      <a href="settings.html" class="org-nav-item">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
        </svg>Settings
      </a>
      <a href="#" class="org-nav-item"
         onclick="HH.Router.signOutAndRedirect();return false;">
        <svg class="org-nav-icon" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>Sign out
      </a>
    </nav>
  </aside>

  <main class="org-main">

    <div style="margin-bottom:var(--space-5);">
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.4px;
                 margin-bottom:4px;">Submissions</h1>
      <p style="font-size:0.875rem;color:var(--color-gray-500);">
        Review, approve, or reject volunteer hour submissions
      </p>
    </div>

    <!-- Tabs -->
    <div class="tabs" style="margin-bottom:var(--space-4);">
      <button class="tab-btn active"
              onclick="switchTab('pending',this)">
        Pending
        <span class="badge badge-pending" id="tab-pending-count"
              style="margin-left:6px;display:none;"></span>
      </button>
      <button class="tab-btn" onclick="switchTab('approved',this)">
        Approved
      </button>
      <button class="tab-btn" onclick="switchTab('rejected',this)">
        Rejected
      </button>
      <button class="tab-btn" onclick="switchTab('all',this)">
        All
      </button>
    </div>

    <div id="submissions-list">
      <!-- Skeleton -->
      <div class="sub-card">
        <div class="sub-card-top">
          <div class="skeleton"
               style="width:38px;height:38px;border-radius:50%;flex-shrink:0;"></div>
          <div class="sub-top-main">
            <div class="skeleton" style="width:50%;height:14px;margin-bottom:6px;"></div>
            <div class="skeleton" style="width:35%;height:11px;"></div>
          </div>
        </div>
        <div class="skeleton" style="width:100%;height:11px;margin-bottom:5px;"></div>
        <div class="skeleton" style="width:70%;height:11px;"></div>
      </div>
    </div>

  </main>
  <script src="../js/theme.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/router.js"></script>

  <script>

    HH.Router.protect("org");

    var _uid         = null;
    var _allSubs     = {};    // { key: submissionObj }
    var _activeTab   = "pending";

    HH.Router.onReady(function (uid) {
      _uid = uid;
      listenSubmissions(uid);
    });


    function listenSubmissions(uid) {
      HH.listenSubmissionsForOrg(uid, function (list) {
        _allSubs = {};
        list.forEach(function (s) {
          _allSubs[s._key] = s;
        });

        var pendingCount = list.filter(function (s) {
          return s.status === "pending";
        }).length;

        var badge     = document.getElementById("sb-pending-badge");
        var tabBadge  = document.getElementById("tab-pending-count");
        if (pendingCount > 0) {
          badge.textContent    = pendingCount;
          badge.style.display  = "inline-flex";
          tabBadge.textContent = pendingCount;
          tabBadge.style.display = "inline-flex";
        } else {
          badge.style.display    = "none";
          tabBadge.style.display = "none";
        }

        renderTab();
      });
    }


    function switchTab(tab, btn) {
      _activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderTab();
    }


    function renderTab() {
      var all = Object.values(_allSubs);

      var filtered = _activeTab === "all"
        ? all
        : all.filter(function (s) { return s.status === _activeTab; });

      // Sort newest first
      filtered.sort(function (a, b) {
        return (b.submitted_at || 0) - (a.submitted_at || 0);
      });

      var container = document.getElementById("submissions-list");

      if (!filtered.length) {
        container.innerHTML =
          '<div class="empty-state" style="padding:3rem;">' +
            '<p style="font-size:0.875rem;color:var(--color-gray-400);">' +
              'No ' + (_activeTab === "all" ? "" : _activeTab + " ") +
              'submissions.' +
            '</p>' +
          '</div>';
        return;
      }

      var html = "";
      filtered.forEach(function (s) {
        var ini     = initials(s.volunteer_name || "?");
        var dateStr = s.date
          ? new Date(s.date).toLocaleDateString("en-US",
              { month: "short", day: "numeric", year: "numeric" })
          : "";
        var submittedStr = s.submitted_at
          ? new Date(s.submitted_at).toLocaleDateString("en-US",
              { month: "short", day: "numeric" })
          : "";

        var descBlock = s.description
          ? '<div class="sub-desc">' + escHtml(s.description) + '</div>'
          : "";

        var actionsBlock = "";
        if (s.status === "pending") {
          actionsBlock =
            '<div class="sub-actions">' +
              '<button class="btn btn-sm btn-success"' +
                ' onclick="approveSubmission(\'' + escHtml(s._key) + '\',\'' +
                escHtml(s.volunteer_id) + '\',' + (s.hours || 0) + ')">' +
                'Approve' +
              '</button>' +
              '<input class="form-input reject-input" type="text"' +
                ' id="note-' + escHtml(s._key) + '"' +
                ' placeholder="Reason for rejection (optional)" />' +
              '<button class="btn btn-sm btn-outline"' +
                ' onclick="rejectSubmission(\'' + escHtml(s._key) + '\')">' +
                'Reject' +
              '</button>' +
            '</div>';
        } else {
          var reviewedStr = s.reviewed_at
            ? "Reviewed " + new Date(s.reviewed_at).toLocaleDateString("en-US",
                { month: "short", day: "numeric" })
            : "";
          actionsBlock =
            '<div class="sub-actions">' +
              '<span class="badge badge-' + s.status + '">' +
                s.status.charAt(0).toUpperCase() + s.status.slice(1) +
              '</span>' +
              (reviewedStr ? '<span class="reviewed-note">' +
                reviewedStr + '</span>' : '') +
            '</div>';
        }

        html +=
          '<div class="sub-card" id="subcard-' + escHtml(s._key) + '">' +
            '<div class="sub-card-top">' +
              '<div class="sub-avatar">' + ini + '</div>' +
              '<div class="sub-top-main">' +
                '<div class="sub-vol-name">' +
                  escHtml(s.volunteer_name || "Unknown") +
                '</div>' +
                '<div class="sub-opp-title">' +
                  escHtml(s.opportunity_title || "Volunteer hours") +
                '</div>' +
              '</div>' +
              '<div style="flex-shrink:0;text-align:right;">' +
                '<div style="font-size:1.1rem;font-weight:800;' +
                     'color:var(--color-primary);">' +
                  (s.hours || 0) + 'h' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="sub-meta-row">' +
              '<div class="sub-meta-item">' +
                '<svg viewBox="0 0 24 24">' +
                '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
                '<line x1="16" y1="2" x2="16" y2="6"/>' +
                '<line x1="8" y1="2" x2="8" y2="6"/>' +
                '<line x1="3" y1="10" x2="21" y2="10"/></svg>' +
                escHtml(dateStr) +
              '</div>' +
              (s.start_time && s.end_time
                ? '<div class="sub-meta-item">' +
                    '<svg viewBox="0 0 24 24">' +
                    '<circle cx="12" cy="12" r="10"/>' +
                    '<polyline points="12 6 12 12 16 14"/></svg>' +
                    escHtml(s.start_time) + ' – ' + escHtml(s.end_time) +
                  '</div>'
                : '') +
              '<div class="sub-meta-item" style="color:var(--color-gray-400);">' +
                'Submitted ' + submittedStr +
              '</div>' +
            '</div>' +
            descBlock +
            actionsBlock +
          '</div>';
      });

      container.innerHTML = html;
    }


    function approveSubmission(key, volunteerId, hours) {
      var btn = event.target;
      btn.disabled    = true;
      btn.textContent = "Approving...";

      HH.db.ref("users/" + volunteerId + "/total_hours")
        .once("value")
        .then(function (snap) {
          var current = parseFloat(snap.val() || 0);
          var updated = current + parseFloat(hours);

          var updates = {};
          updates["submissions/" + key + "/status"]      = "approved";
          updates["submissions/" + key + "/reviewed_at"] = HH.TIMESTAMP;
          updates["users/" + volunteerId + "/total_hours"] = updated;

          return HH.db.ref().update(updates);
        })
        .catch(function (err) {
          btn.disabled    = false;
          btn.textContent = "Approve";
          alert("Approve failed: " + err.message);
        });
    }


    function rejectSubmission(key) {
      var btn  = event.target;
      var note = (document.getElementById("note-" + key) || {}).value || "";

      btn.disabled    = true;
      btn.textContent = "Rejecting...";

      var updates = {};
      updates["submissions/" + key + "/status"]         = "rejected";
      updates["submissions/" + key + "/reviewed_at"]    = HH.TIMESTAMP;
      updates["submissions/" + key + "/rejection_note"] = note || null;

      HH.db.ref().update(updates).catch(function (err) {
        btn.disabled    = false;
        btn.textContent = "Reject";
        alert("Reject failed: " + err.message);
      });
    }


    function initials(name) {
      var p = (name || "?").trim().split(" ");
      return p.length === 1
        ? p[0].charAt(0).toUpperCase()
        : (p[0].charAt(0) + p[1].charAt(0)).toUpperCase();
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

  </script>
</body>
</html>
