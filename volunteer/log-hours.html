<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HourHero — Log Hours</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <style>
    body { background: var(--bg-page); }

    .mode-toggle {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: var(--space-4);
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 0.6rem;
      font-size: 0.875rem; font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background .15s, color .15s;
      text-align: center;
    }

    .mode-btn.active {
      background: var(--color-primary);
      color: #fff;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-3);
    }

    .hours-display {
      background: var(--color-primary-light);
      border: 1.5px solid var(--color-primary-mid);
      border-radius: var(--radius-md);
      padding: 0.625rem 0.875rem;
      font-size: 0.95rem; font-weight: 700;
      color: var(--color-primary);
      text-align: center;
    }

    .log-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }

    .log-card-hdr {
      padding: var(--space-4) var(--space-5) var(--space-3);
      border-bottom: 1px solid var(--border-color);
    }

    .log-card-body { padding: 0 var(--space-5); }

    .rejection-note {
      font-size: 0.775rem;
      color: var(--color-danger-text);
      margin-top: 3px;
      font-style: italic;
    }

    /* ===== CHAT UI ===== */
    .chat-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      height: 540px;
      margin-bottom: var(--space-4);
      overflow: hidden;
    }

    .chat-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-color);
      background: var(--color-gray-50);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
    }

    .chat-header-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--color-success);
      flex-shrink: 0;
    }

    .chat-header-title { font-size: 0.875rem; font-weight: 700; color: var(--text-primary); }
    .chat-header-sub   { font-size: 0.775rem; color: var(--text-secondary); margin-left: auto; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .msg { display: flex; gap: var(--space-2); max-width: 88%; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
    }

    .msg.bot  .msg-avatar { background: var(--color-primary-light); color: var(--color-primary); }
    .msg.user .msg-avatar { background: var(--color-gray-200);      color: var(--color-gray-600); }

    .msg-bubble {
      padding: 0.6rem 0.875rem;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .msg.bot  .msg-bubble { background: var(--color-gray-100); color: var(--text-primary); border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--color-primary);  color: #fff;               border-bottom-right-radius: 4px; }

    .confirm-card {
      background: var(--bg-card);
      border: 1.5px solid var(--color-primary-mid);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-top: var(--space-2);
      font-size: 0.85rem;
    }

    .confirm-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.83rem;
    }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-row-label { color: var(--text-secondary); font-weight: 600; }
    .confirm-row-val   { color: var(--text-primary);   font-weight: 600; text-align: right; max-width: 60%; }

    .confirm-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }

    .chat-input-row {
      border-top: 1px solid var(--border-color);
      padding: var(--space-3) var(--space-4);
      display: flex;
      gap: var(--space-2);
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 0.6rem 0.875rem;
      font-size: 0.9rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-full);
      outline: none;
      transition: border-color .15s, background 0.2s;
      background: var(--color-gray-50);
      color: var(--text-primary);
    }

    .chat-input:focus { border-color: var(--color-primary); background: var(--bg-card); }
    .chat-input::placeholder { color: var(--text-muted); }

    .chat-send {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--color-primary);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }

    .chat-send:hover    { background: var(--color-primary-dark); }
    .chat-send:disabled { background: var(--color-gray-300); cursor: not-allowed; }

    .chat-send svg {
      width: 16px; height: 16px;
      stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Nudge pill — appears below a general-question response when
       the user is mid-flow, so they know they can resume logging */
    .resume-nudge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      padding: 4px 10px;
      background: var(--color-primary-light);
      color: var(--color-primary);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--color-primary-mid);
      transition: background .15s;
    }
    .resume-nudge:hover { background: var(--color-primary-mid); }

    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--color-gray-100) 25%,
        var(--color-gray-200) 50%, var(--color-gray-100) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: var(--radius-sm);
    }

    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
    .typing-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--text-muted);
      margin: 0 2px; animation: blink 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .mini-spin {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border-color);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="dashboard.html" class="top-nav-logo">HourHero</a>
    <div class="top-nav-right">
      <a href="settings.html" class="nav-avatar" id="nav-avatar">HH</a>
    </div>
  </nav>

  <main class="page-with-nav">
    <div class="page-content">

      <div class="page-header">
        <h1 class="page-header-title">Log hours</h1>
        <p class="page-header-sub">Submit your volunteer time for approval</p>
      </div>

      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-standard"
                onclick="setMode('standard')">Standard entry</button>
        <button class="mode-btn" id="btn-complex"
                onclick="setMode('complex')">Complex entry (AI)</button>
      </div>


      <!-- ======== STANDARD MODE ======== -->
      <div id="standard-mode">

        <div class="form-card">
          <div id="form-msg"></div>

          <div class="form-group">
            <label class="form-label" for="sel-opp">Opportunity</label>
            <select class="form-select" id="sel-opp">
              <option value="">— Select an opportunity —</option>
            </select>
            <div class="form-hint">
              Only joined opportunities appear here.
              <a href="opportunities.html">Browse more</a>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="sel-date">Date of service</label>
            <input class="form-input" type="date" id="sel-date"/>
          </div>

          <div class="time-row">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="sel-start">Start</label>
              <input class="form-input" type="time" id="sel-start" oninput="calcHours()"/>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="sel-end">End</label>
              <input class="form-input" type="time" id="sel-end" oninput="calcHours()"/>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Hours</label>
              <div class="hours-display" id="hours-display">0.0 h</div>
            </div>
          </div>

          <div class="form-group" style="margin-top:var(--space-4);">
            <label class="form-label" for="sel-desc">
              Description
              <span class="form-label-optional">(optional)</span>
            </label>
            <textarea class="form-textarea" id="sel-desc"
                      placeholder="Brief description of what you did..."
                      rows="3"></textarea>
          </div>

          <button class="btn btn-primary btn-full"
                  id="btn-submit" onclick="handleSubmit()">
            Submit for approval
          </button>
        </div>

        <!-- Submission history -->
        <div class="log-card">
          <div class="log-card-hdr">
            <div class="section-heading" style="margin-bottom:var(--space-3);">
              My submissions
            </div>
            <div class="tabs" style="margin-bottom:0;border-bottom:none;">
              <button class="tab-btn active"
                      onclick="switchTab('pending',this)">Pending</button>
              <button class="tab-btn"
                      onclick="switchTab('approved',this)">Approved</button>
              <button class="tab-btn"
                      onclick="switchTab('rejected',this)">Rejected</button>
            </div>
          </div>
          <div class="log-card-body">
            <div id="tab-pending"  class="tab-panel active">
              <div id="list-pending"></div>
            </div>
            <div id="tab-approved" class="tab-panel">
              <div id="list-approved"></div>
            </div>
            <div id="tab-rejected" class="tab-panel">
              <div id="list-rejected"></div>
            </div>
          </div>
        </div>

      </div>


      <!-- ======== COMPLEX (AI CHATBOT) MODE ======== -->
      <div id="complex-mode" style="display:none;">

        <div class="chat-container">
          <div class="chat-header">
            <div class="chat-header-dot"></div>
            <div class="chat-header-title">HourHero Assistant</div>
            <div class="chat-header-sub">Describe your volunteer schedule in your own words</div>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-row">
            <input class="chat-input" type="text" id="chat-input"
                   placeholder="Describe when and where you volunteered..."
                   onkeydown="if(event.key==='Enter' && !event.shiftKey) sendChat()"/>
            <button class="chat-send" id="chat-send-btn" onclick="sendChat()">
              <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/>

    <a href="log-hours.html" class="bottom-nav-item active">

      </svg><span>Log</span>

      </svg><span>Profile</span>

  </nav>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/router.js"></script>

  <script>

    HH.Router.protect("volunteer");

    var _uid        = null;
    var _joinedOpps = {};

    HH.Router.onReady(function(uid) {
      _uid = uid;
      setDefaultDate();
      loadAvatar(uid);
      loadJoinedOpps(uid);
      listenSubmissions(uid);
      initChat();
    });


    // ==================================================
    // MODE TOGGLE
    // ==================================================
    function setMode(mode) {
      var isStd = mode === "standard";
      document.getElementById("standard-mode").style.display = isStd ? "block" : "none";
      document.getElementById("complex-mode").style.display  = isStd ? "none"  : "block";
      document.getElementById("btn-standard").classList.toggle("active",  isStd);
      document.getElementById("btn-complex").classList.toggle("active",  !isStd);
    }


    // ==================================================
    // STANDARD MODE
    // ==================================================
    function setDefaultDate() {
      var today = new Date().toISOString().split("T")[0];
      document.getElementById("sel-date").value = today;
      document.getElementById("sel-date").max   = today;
    }

    function loadAvatar(uid) {
      HH.db.ref("users/" + uid + "/name").once("value").then(function(s) {
        document.getElementById("nav-avatar").textContent = ini(s.val() || "HH");
      });
    }

    function loadJoinedOpps(uid) {
      HH.db.ref("users/" + uid + "/joined_opportunities")
        .once("value")
        .then(function(snap) {
          if (!snap.exists() || !snap.val()) return [];
          return Promise.all(Object.keys(snap.val()).map(function(id) {
            return HH.db.ref("opportunities/" + id).once("value");
          }));
        })
        .then(function(snaps) {
          if (!snaps || !snaps.length) return;
          var sel = document.getElementById("sel-opp");
          snaps.forEach(function(os) {
            if (!os || !os.exists()) return;
            var o = os.val(); var id = os.key;
            _joinedOpps[id] = {
              title:    o.title    || "Untitled",
              org_id:   o.org_id   || "",
              org_name: o.org_name || ""
            };
            var opt = document.createElement("option");
            opt.value       = id;
            opt.textContent = o.title + (o.org_name ? " — " + o.org_name : "");
            sel.appendChild(opt);
          });
        });
    }

    function calcHours() {
      var s = document.getElementById("sel-start").value;
      var e = document.getElementById("sel-end").value;
      var d = document.getElementById("hours-display");
      if (!s || !e) { d.textContent = "0.0 h"; return; }
      var diff = toMin(e) - toMin(s);
      if (diff <= 0) { d.textContent = "—"; return; }
      d.textContent = (diff / 60).toFixed(1) + " h";
    }

    function toMin(t) {
      var p = t.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    function switchTab(tab, btn) {
      ["pending","approved","rejected"].forEach(function(t) {
        document.getElementById("tab-" + t).classList.toggle("active", t === tab);
      });
      document.querySelectorAll(".tab-btn").forEach(function(b) {
        b.classList.toggle("active", b === btn);
      });
    }

    function listenSubmissions(uid) {
      HH.listenSubmissionsForVolunteer(uid, function(list) {
        var buckets = { pending: [], approved: [], rejected: [] };
        list.forEach(function(s) {
          if (buckets[s.status]) buckets[s.status].push(s);
        });
        Object.keys(buckets).forEach(function(status) {
          buckets[status].sort(function(a,b) {
            return (b.submitted_at||0)-(a.submitted_at||0);
          });
          renderLogs(status, buckets[status]);
        });
      });
    }

    function renderLogs(status, items) {
      var c = document.getElementById("list-" + status);
      if (!c) return;
      if (!items.length) {
        c.innerHTML =
          '<div class="empty-state" style="padding:1.5rem 0;">' +
            '<p style="font-size:.875rem;color:var(--text-muted);">' +
              'No ' + status + ' submissions.' +
            '</p>' +
          '</div>';
        return;
      }
      var html = "";
      items.forEach(function(s) {
        var ds = s.date
          ? new Date(s.date).toLocaleDateString("en-US",
              {month:"short",day:"numeric",year:"numeric"})
          : "";
        var rn = status === "rejected" && s.rejection_note
          ? '<div class="rejection-note">Reason: ' + esc(s.rejection_note) + '</div>'
          : "";
        html +=
          '<div class="list-item">' +
            '<div class="list-item-icon"><svg viewBox="0 0 24 24">' +
            '<circle cx="12" cy="12" r="10"/>' +
            '<polyline points="12 6 12 12 16 14"/></svg></div>' +
            '<div class="list-item-main">' +
              '<div class="list-item-title">' +
                esc(s.opportunity_title || "Volunteer hours") +
              '</div>' +
              '<div class="list-item-sub">' +
                esc(s.org_name || "") + (ds ? " &middot; " + ds : "") +
              '</div>' +
              rn +
            '</div>' +
            '<div class="list-item-end">' +
              '<div class="list-item-hours">' + (s.hours||0) + 'h</div>' +
              '<div class="badge badge-' + status + '" style="margin-top:4px;">' +
                status.charAt(0).toUpperCase() + status.slice(1) +
              '</div>' +
            '</div>' +
          '</div>';
      });
      c.innerHTML = html;
    }

    function handleSubmit() {
      var oppId = document.getElementById("sel-opp").value;
      var date  = document.getElementById("sel-date").value;
      var start = document.getElementById("sel-start").value;
      var end   = document.getElementById("sel-end").value;
      var desc  = document.getElementById("sel-desc").value.trim();

      clearFormMsg();

      if (!oppId)  return showFormMsg("error","Please select an opportunity.");
      if (!date)   return showFormMsg("error","Please select a date.");
      if (new Date(date) > new Date())
        return showFormMsg("error","Date cannot be in the future.");
      if (!start || !end)
        return showFormMsg("error","Please enter start and end times.");
      var diff = toMin(end) - toMin(start);
      if (diff <= 0) return showFormMsg("error","End time must be after start time.");
      var hours = diff / 60;
      if (hours < 0.25) return showFormMsg("error","Minimum entry is 15 minutes.");
      if (hours > 12)   return showFormMsg("error","Maximum entry is 12 hours.");

      var opp = _joinedOpps[oppId] || {};
      var btn = document.getElementById("btn-submit");
      btn.disabled = true; btn.textContent = "Submitting...";

      HH.listSubmissionsForVolunteer(_uid)
        .then(function(list) {
          var dup = false;
          list.forEach(function(s) {
            if (s.opportunity_id === oppId && s.date === date &&
                (s.status === "pending" || s.status === "approved")) dup = true;
          });
          if (dup) {
            btn.disabled = false; btn.textContent = "Submit for approval";
            return showFormMsg("error",
              "You already have an entry for this opportunity on this date.");
          }
          var key = HH.db.ref("submissions").push().key;
          var record = {
            submission_id: key, volunteer_id: _uid,
            opportunity_id: oppId, opportunity_title: opp.title||"",
            org_id: opp.org_id||"", org_name: opp.org_name||"",
            date: date, start_time: start, end_time: end,
            hours: parseFloat(hours.toFixed(2)),
            description: desc, status: "pending",
            submitted_at: HH.TIMESTAMP
          };
          return HH.db.ref("users/" + _uid + "/pending_count").once("value")
            .then(function(pc) {
              var u = {};
              u["submissions/" + key]               = record;
              u["users/" + _uid + "/pending_count"] = (pc.val()||0) + 1;
              return HH.db.ref().update(u);
            });
        })
        .then(function() {
          if (!btn.disabled) return;
          btn.disabled = false; btn.textContent = "Submit for approval";
          showFormMsg("success","Submitted! Waiting for the organization to review.");
          document.getElementById("sel-start").value = "";
          document.getElementById("sel-end").value   = "";
          document.getElementById("sel-desc").value  = "";
          document.getElementById("hours-display").textContent = "0.0 h";
        })
        .catch(function(err) {
          btn.disabled = false; btn.textContent = "Submit for approval";
          showFormMsg("error","Submit failed: " + err.message);
        });
    }

    function showFormMsg(type, text) {
      var bg = type==="error" ? "var(--color-danger-light)"   : "var(--color-success-light)";
      var co = type==="error" ? "var(--color-danger-text)"    : "var(--color-success-text)";
      var bd = type==="error" ? "var(--color-danger-border)"  : "var(--color-success-border)";
      document.getElementById("form-msg").innerHTML =
        '<div style="background:'+bg+';color:'+co+';border:1px solid '+bd+
        ';border-radius:var(--radius-md);padding:.7rem .9rem;' +
        'font-size:.875rem;font-weight:500;margin-bottom:1rem;">' +
        esc(text) + '</div>';
    }

    function clearFormMsg() {
      document.getElementById("form-msg").innerHTML = "";
    }


    // ==================================================
    // COMPLEX (AI CHATBOT) MODE
    // ==================================================
    // Volunteer-first assistant: interprets natural-language
    // schedules, collects missing fields, ONE Firebase entry
    // per schedule. Off-topic questions get a short answer,
    // then the bot resumes collecting log details.
    // JSON envelopes (<<<JSON>>> ... <<<END>>>) drive confirm/submit.
    // ==================================================

    var chatState = {
      step:          "open",   // open | collecting | confirm | done
      loggingActive: false,    // true while gathering one schedule
      oppId:         null,
      oppTitle:      null,
      orgId:         null,
      orgName:       null,
      dates:         [],
      totalHours:    0,
      description:   null
    };

    // Full conversation history sent to the API each turn
    var chatHistory = [];

    var _userAvatar = "ME";

    function initChat() {
      HH.db.ref("users/" + _uid + "/name").once("value").then(function(s) {
        _userAvatar = ini(s.val() || "ME");
      });

      // Build the system prompt once joined opps are known
      // We wait 600ms so _joinedOpps has time to populate
      setTimeout(function() {
        buildSystemPrompt();
        botMsg(
          "Hi! I help you log volunteer hours. Describe your schedule in your own " +
          "words — even if it's unusual (e.g. \"every other Saturday in March, " +
          "about 3 hours\" or \"Tuesdays and Thursdays last week, 2–4pm\").\n\n" +
          "I'll turn it into one log entry and ask only for what's missing. " +
          "If you go off-topic mid-way, I'll answer briefly and come back to your hours.\n\n" +
          "What volunteering would you like to log?"
        );
      }, 700);
    }

    // Build the system prompt that governs Claude's behaviour
    var _systemPrompt = "";

    function buildSystemPrompt() {
      var oppList = Object.keys(_joinedOpps).map(function(id) {
        var o = _joinedOpps[id];
        return "- ID:" + id + " | " + o.title + " | org: " + (o.org_name||"Unknown");
      }).join("\n");

      _systemPrompt =
        "You are the HourHero volunteer logging assistant. Your main job is to help " +
        "students log volunteer hours by understanding natural, casual, or unusual schedules.\n\n" +

        "=== ONE ENTRY PER SCHEDULE (critical) ===\n" +
        "- Each volunteering SCHEDULE the user is logging becomes exactly ONE log entry in Firebase.\n" +
        "- A schedule = one continuous volunteering period they describe (even if it spans multiple days).\n" +
        "- Put ALL dates for that schedule in the JSON \"dates\" array; \"hours\" is the TOTAL hours across those dates.\n" +
        "- Never create multiple confirm/submit JSON blocks in one reply. Never split one schedule into several entries.\n" +
        "- If the user describes TWO unrelated schedules (different places/opportunities or clearly separate stints), " +
        "say you'll log them one at a time, finish the first with ONE confirm JSON, then start the second after submit.\n\n" +

        "=== INTERPRETING UNUSUAL SCHEDULES ===\n" +
        "- Parse fuzzy language: \"last few Tuesdays\", \"every other weekend in April\", \"9–1 on and off\", " +
        "\"about 4 hours total\", \"half days Monday–Wednesday\".\n" +
        "- Infer dates from context using today's date below; ask if ambiguous.\n" +
        "- Sum hours correctly for multi-day schedules into a single total.\n" +
        "- The user can ONLY log hours for opportunities they have JOINED (see list below).\n" +
        "- NEVER invent a new opportunity, org, or opp_id. opp_id in JSON MUST be an exact ID from JOINED OPPORTUNITIES.\n" +
        "- If the user names a place not in the joined list, tell them to open Explore, join that opportunity first, then come back to log hours.\n" +
        "- Match by title/org keywords only among JOINED opportunities; ask which one if unclear.\n" +
        "- Fields required before confirm: valid joined opp_id, date(s), total hours, short description.\n\n" +

        "=== COLLECTION FLOW ===\n" +
        "- When the user starts describing volunteer work, treat logging as ACTIVE until confirm is submitted or cancelled.\n" +
        "- Ask for one missing field at a time; do not repeat fields you already have.\n" +
        "- When ALL fields are ready for the current schedule, show a brief summary in visible text, then append:\n" +
        "<<<JSON>>>\n" +
        "{\"action\":\"confirm\",\"opp_id\":\"ID\",\"opp_title\":\"...\",\"org_id\":\"...\",\"org_name\":\"...\"," +
        "\"dates\":[\"YYYY-MM-DD\"],\"hours\":3.5,\"description\":\"...\"}\n" +
        "<<<END>>>\n" +
        "- After user confirms in chat: <<<JSON>>>\n{\"action\":\"submit\"}\n<<<END>>>\n" +
        "- If user cancels: <<<JSON>>>\n{\"action\":\"cancel\"}\n<<<END>>>\n\n" +

        "=== OFF-TOPIC QUESTIONS (during logging) ===\n" +
        "- If the user asks something unrelated WHILE you are collecting volunteer info (or they pivoted mid-flow):\n" +
        "  1) Give a clear, helpful answer or clarification to their question (brief).\n" +
        "  2) In the same message, gently return to logging: remind what you still need OR repeat the last question.\n" +
        "- Do NOT refuse off-topic questions; answer them, then steer back.\n" +
        "- Do NOT emit confirm JSON until the current schedule has all required fields.\n" +
        "- If they were not logging yet and only ask off-topic, answer helpfully and invite them to describe volunteer hours when ready.\n\n" +

        "=== STYLE ===\n" +
        "- Warm, concise, mobile-friendly.\n" +
        "- JSON envelopes are hidden from the user; never mention JSON to them.\n\n" +

        "JOINED OPPORTUNITIES (use these IDs in confirm JSON):\n" +
        (oppList || "None yet — user hasn't joined any opportunities.") + "\n\n" +

        "Today's date: " + new Date().toLocaleDateString("en-US", {
          weekday:"long", year:"numeric", month:"long", day:"numeric"
        });
    }

    function sendChat() {
      var input = document.getElementById("chat-input");
      var text  = input.value.trim();
      if (!text) return;

      input.value = "";
      addMsg("user", text);

      if (chatState.step === "open" || chatState.step === "collecting") {
        if (looksLikeVolunteering(text)) {
          chatState.loggingActive = true;
          chatState.step = "collecting";
        }
      }

      chatHistory.push({ role: "user", content: text });

      // Hint to the model when user is mid logging flow
      if (chatState.loggingActive && chatState.step !== "confirm") {
        chatHistory[chatHistory.length - 1].content =
          text + "\n\n[System note: Volunteer logging is in progress for ONE schedule. " +
          "If this message is off-topic, answer it briefly then ask for the next missing log detail. " +
          "Do not emit confirm JSON until opportunity, dates, total hours, and description are complete.]";
      }

      document.getElementById("chat-send-btn").disabled = true;
      showTyping();

      callClaude().then(function(reply) {
        removeTyping();
        document.getElementById("chat-send-btn").disabled = false;
        handleClaudeReply(reply);
      }).catch(function(err) {
        removeTyping();
        document.getElementById("chat-send-btn").disabled = false;
        botMsg("Sorry, I had trouble connecting. Please check your internet and try again.\n(" + err.message + ")");
      });
    }

    // Chat via local server proxy (npm start) — uses free Gemini API key in .env
    function callClaude() {
      return fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system:   _systemPrompt,
          messages: chatHistory
        })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) {
            throw new Error(data.error || ("API error " + res.status));
          }
          return data;
        });
      })
      .then(function(data) {
        var text = (data.content || [])
          .filter(function(b) { return b.type === "text"; })
          .map(function(b) { return b.text; })
          .join("");
        return text;
      });
    }

    // Parse Claude's reply — extract any JSON envelope, show the visible text
    function handleClaudeReply(fullReply) {
      var jsonMatch = fullReply.match(/<<<JSON>>>\s*([\s\S]*?)\s*<<<END>>>/);
      var visibleText = fullReply
        .replace(/<<<JSON>>>[\s\S]*?<<<END>>>/g, "")
        .trim();

      // Add to history using full reply (including JSON) so Claude remembers context
      chatHistory.push({ role: "assistant", content: fullReply });

      if (jsonMatch) {
        var envelope;
        try { envelope = JSON.parse(jsonMatch[1].trim()); } catch(e) { envelope = null; }

        if (envelope) {
          if (envelope.action === "confirm") {
            if (chatState.step === "confirm") {
              if (visibleText) botMsg(visibleText);
              return;
            }

            var resolved = resolveJoinedOpp(envelope);
            if (!resolved) {
              if (visibleText) botMsg(visibleText);
              botMsg(
                "I can't submit this yet — \"" + (envelope.opp_title || "that opportunity") +
                "\" isn't in your joined opportunities.\n\n" +
                "Go to the Explore tab, find the opportunity, tap Join, then tell me again what you did."
              );
              return;
            }

            chatState.loggingActive = true;
            chatState.oppId       = resolved.id;
            chatState.oppTitle    = resolved.title;
            chatState.orgId       = resolved.org_id;
            chatState.orgName     = resolved.org_name;
            chatState.dates       = envelope.dates       || [];
            chatState.totalHours  = envelope.hours       || 0;
            chatState.description = envelope.description || "";
            chatState.step        = "confirm";

            if (visibleText) botMsg(visibleText);
            else botMsg("Here's a summary of the entry I'm about to create:");
            showConfirmCard();
            return;

          } else if (envelope.action === "submit") {
            submitFromChat();
            return;

          } else if (envelope.action === "cancel") {
            resetChatState();
            if (visibleText) botMsg(visibleText);
            else botMsg("No problem — entry cancelled. Describe another volunteer schedule when you're ready.");
            return;
          }
        }
      }

      if (visibleText) botMsg(visibleText);
    }

    // Map AI envelope to a real joined opportunity (required for Firebase writes)
    function resolveJoinedOpp(envelope) {
      var id = String(envelope.opp_id || "").trim();
      if (id && _joinedOpps[id]) {
        var o = _joinedOpps[id];
        return {
          id:        id,
          title:     o.title    || "",
          org_id:    o.org_id   || "",
          org_name:  o.org_name || ""
        };
      }

      var needle = String(envelope.opp_title || envelope.opp_id || "")
        .toLowerCase().trim();
      if (!needle) return null;

      var keys = Object.keys(_joinedOpps);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var o2 = _joinedOpps[k];
        var title = (o2.title    || "").toLowerCase();
        var org   = (o2.org_name || "").toLowerCase();
        if (title === needle || org === needle ||
            title.indexOf(needle) >= 0 || needle.indexOf(title) >= 0 ||
            (org && (org.indexOf(needle) >= 0 || needle.indexOf(org) >= 0))) {
          return {
            id:        k,
            title:     o2.title    || "",
            org_id:    o2.org_id   || "",
            org_name:  o2.org_name || ""
          };
        }
      }
      return null;
    }

    function looksLikeVolunteering(text) {
      if (!text) return false;
      var t = text.toLowerCase();
      return /volunteer|hours|log|shift|food bank|shelter|tutor|helped|worked at|opportunity|joined/.test(t)
        || /\d+\s*(am|pm|hour|hr)/.test(t)
        || /\b(mon|tue|wed|thu|fri|sat|sun|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\b/.test(t);
    }

    // Show the confirmation card inside the chat
    function showConfirmCard() {
      var dStr = (chatState.dates || []).map(function(d) {
        return new Date(d + "T12:00:00").toLocaleDateString("en-US",
          {month:"short", day:"numeric", year:"numeric"});
      }).join(", ") || "Not specified";

      var cardHTML =
        '<div class="confirm-card">' +
          '<div style="font-size:0.85rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">Review this schedule (1 log entry)</div>' +
          confRow("Opportunity", esc(chatState.oppTitle || "Unknown")) +
          confRow("Organization", esc(chatState.orgName || "Unknown")) +
          confRow("Date(s)", esc(dStr)) +
          confRow("Total hours", (chatState.totalHours || 0) + "h") +
          confRow("Description", esc(chatState.description || "")) +
          '<div class="confirm-actions">' +
            '<button class="btn btn-sm btn-success" onclick="submitFromChat()">Confirm &amp; submit</button>' +
            '<button class="btn btn-sm btn-secondary" onclick="cancelFromChat()">Cancel</button>' +
          '</div>' +
        '</div>';

      addBotHTML("", cardHTML);
    }

    function confRow(label, val) {
      return '<div class="confirm-row">' +
        '<span class="confirm-row-label">' + label + '</span>' +
        '<span class="confirm-row-val">'   + val   + '</span>' +
      '</div>';
    }

    // Submit exactly ONE log entry for the current schedule
    function submitFromChat() {
      if (chatState.step === "done") return;

      var resolved = resolveJoinedOpp({
        opp_id:    chatState.oppId,
        opp_title: chatState.oppTitle
      });

      if (!resolved || !chatState.dates.length || !chatState.totalHours) {
        botMsg(
          "I can't submit — please join the opportunity on the Explore page first, " +
          "then log your hours again."
        );
        resetChatState();
        return;
      }

      document.querySelectorAll(".confirm-actions button").forEach(function(b) {
        b.disabled = true;
      });

      var mainDate = chatState.dates[chatState.dates.length - 1];
      var key      = HH.db.ref("submissions").push().key;
      var record   = {
        submission_id:     key,
        volunteer_id:      _uid,
        opportunity_id:    resolved.id,
        opportunity_title: resolved.title,
        org_id:            resolved.org_id,
        org_name:          resolved.org_name,
        date:              mainDate,
        dates_covered:     chatState.dates.join(", "),
        hours:             parseFloat(chatState.totalHours),
        description:       chatState.description || "",
        status:            "pending",
        submitted_at:      HH.TIMESTAMP
      };

      HH.listSubmissionsForVolunteer(_uid)
        .then(function(list) {
          var dup = false;
          list.forEach(function(s) {
            if (s.opportunity_id === resolved.id && s.date === mainDate &&
                (s.status === "pending" || s.status === "approved")) {
              dup = true;
            }
          });
          if (dup) {
            throw new Error("DUPLICATE");
          }
          return HH.db.ref("users/" + _uid + "/pending_count").once("value");
        })
        .then(function(pc) {
          var updates = {};
          updates["submissions/" + key]               = record;
          updates["users/" + _uid + "/pending_count"] = (pc.val() || 0) + 1;
          return HH.db.ref().update(updates);
        })
        .then(function() {
          chatState.step = "done";
          botMsg(
            "Done! One log entry (" + chatState.totalHours + " hour" +
            (chatState.totalHours !== 1 ? "s" : "") +
            " total) was submitted for approval. Check the Standard tab for status.\n\n" +
            "Have another separate schedule to log? Describe it and we'll do one entry at a time."
          );
          resetChatState();
        })
        .catch(function(err) {
          document.querySelectorAll(".confirm-actions button").forEach(function(b) {
            b.disabled = false;
          });
          if (err.message === "DUPLICATE") {
            botMsg("You already have a pending or approved entry for that opportunity on that date.");
            resetChatState();
            return;
          }
          var msg = err.message || "Unknown error";
          if (msg.indexOf("PERMISSION_DENIED") >= 0) {
            botMsg(
              "Permission denied — your account couldn't save to the database.\n\n" +
              "Ask your admin to publish the rules in database.rules.json to Firebase " +
              "(Realtime Database → Rules), then try again. Also make sure you joined " +
              "this opportunity on the Explore page first."
            );
          } else {
            botMsg("Something went wrong: " + msg + ". Please try again.");
          }
        });
    }

    function cancelFromChat() {
      resetChatState();
      // Add a cancel message to history so Claude knows the entry was cancelled
      chatHistory.push({
        role: "user",
        content: "(User cancelled the submission entry)"
      });
      botMsg("Entry cancelled. When you're ready, describe the volunteer schedule you'd like to log.");
    }

    function resetChatState() {
      chatState = {
        step: "open", loggingActive: false,
        oppId: null, oppTitle: null,
        orgId: null, orgName: null,
        dates: [], totalHours: 0, description: null
      };
    }


    // ---- Chat UI helpers ----
    function addMsg(role, text) {
      var msgs   = document.getElementById("chat-messages");
      var isBot  = role === "bot";
      var lines  = text.split("\n").map(function(l) {
        return l ? '<span>' + esc(l) + '</span>' : '<br/>';
      }).join("");

      msgs.insertAdjacentHTML("beforeend",
        '<div class="msg ' + role + '">' +
          '<div class="msg-avatar">' + (isBot ? "AI" : _userAvatar) + '</div>' +
          '<div class="msg-bubble">' + lines + '</div>' +
        '</div>'
      );
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addBotHTML(text, extraHTML) {
      var msgs  = document.getElementById("chat-messages");
      var lines = text.split("\n").map(function(l) {
        return l ? '<span>' + esc(l) + '</span>' : '<br/>';
      }).join("");

      msgs.insertAdjacentHTML("beforeend",
        '<div class="msg bot">' +
          '<div class="msg-avatar">AI</div>' +
          '<div>' +
            (text ? '<div class="msg-bubble">' + lines + '</div>' : '') +
            extraHTML +
          '</div>' +
        '</div>'
      );
      msgs.scrollTop = msgs.scrollHeight;
    }

    function botMsg(text) { addMsg("bot", text); }

    function showTyping() {
      var msgs = document.getElementById("chat-messages");
      msgs.insertAdjacentHTML("beforeend",
        '<div class="msg bot" id="typing-indicator">' +
          '<div class="msg-avatar">AI</div>' +
          '<div class="msg-bubble" style="padding:.5rem .875rem;">' +
            '<span class="typing-dot"></span>' +
            '<span class="typing-dot"></span>' +
            '<span class="typing-dot"></span>' +
          '</div>' +
        '</div>'
      );
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() {
      var el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }


    // ---- Shared utilities ----
    function ini(n) {
      var p = (n || "HH").trim().split(" ");
      return p.length === 1
        ? p[0][0].toUpperCase()
        : (p[0][0] + p[1][0]).toUpperCase();
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

  </script>
</body>
</html>
